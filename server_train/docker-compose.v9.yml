# v9 訓練：與部署同款基底 Qwen3-4B-Instruct-2507，MAX_LEN=1024 消除 26% 尾端截斷
# （v8 用 640，截掉的是對話收尾輪——弱點 #7「完成後仍多講」的訓練面根因）
services:
  daniel-qlora-v9:
    image: daniel-qlora-train
    container_name: daniel-qlora-v9
    working_dir: /workspace
    command: bash run_train.sh
    environment:
      MODEL_NAME: "Qwen/Qwen3-4B-Instruct-2507"
      TRAIN_JSONL: /workspace/data/train.jsonl
      VAL_JSONL: /workspace/data/val.jsonl
      ADAPTER_DIR: /workspace/out/qlora_adapter_v9
      MAX_LEN: "1024"
      BATCH: "4"
      GRAD_ACCUM: "4"
      EPOCHS: "3"
      EVAL_STEPS: "20"
      OPTIM: "adamw_8bit"
      NEFTUNE_ALPHA: "5"
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    restart: "no"
