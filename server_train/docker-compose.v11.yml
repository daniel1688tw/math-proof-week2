# v11 訓練：資料集與超參同 v10（830 例、4B-2507、MAX_LEN=1024），僅 ADAPTER_DIR 區隔。
# 目的：v10 資料集重訓 + 新 driver（#11 收尾紀律 driver 修復）一起守門——
# v10 守門唯一失效模式（H5 完成後未經請求延伸）現已由 driver closed 階段兜住。
services:
  daniel-qlora-v11:
    image: daniel-qlora-train
    container_name: daniel-qlora-v11
    working_dir: /workspace
    command: bash run_train.sh
    environment:
      MODEL_NAME: "Qwen/Qwen3-4B-Instruct-2507"
      TRAIN_JSONL: /workspace/data/train.jsonl
      VAL_JSONL: /workspace/data/val.jsonl
      ADAPTER_DIR: /workspace/out/qlora_adapter_v11
      MAX_LEN: "1024"
      BATCH: "4"
      GRAD_ACCUM: "4"
      EPOCHS: "3"
      EVAL_STEPS: "20"
      OPTIM: "adamw_8bit"
      NEFTUNE_ALPHA: "5"
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    restart: "no"
