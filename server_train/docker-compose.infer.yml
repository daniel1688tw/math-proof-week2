# 推論服務（遠端評估用）：docker compose -f docker-compose.infer.yml up -d
# port 只綁 127.0.0.1（COMMANDS.md §9），本機經 SSH tunnel 存取：
#   ssh -f -N -L 8899:localhost:8899 daniel@192.168.1.102
services:
  daniel-qlora-infer:
    image: daniel-qlora-train
    container_name: daniel-qlora-infer
    working_dir: /workspace
    command: python inference_server.py
    environment:
      MODEL_NAME: "Qwen/Qwen3-8B"
      ADAPTER_DIR: /workspace/out/qlora8b_adapter_v1
      HF_HOME: /workspace/hf_cache
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    restart: "no"
