# 驗證式生成服務（BoN＋數學驗證器，單張 4090）：
#   docker compose -f docker-compose.verified.yml up -d
services:
  daniel-qlora-verified:
    image: daniel-qlora-train
    container_name: daniel-qlora-verified
    working_dir: /workspace
    command: python inference_server_verified.py
    environment:
      MODEL_NAME: "Qwen/Qwen3-4B-Instruct-2507"
      ADAPTER_DIR: /workspace/qlora_adapter_v8
      VERIFIER_MODEL: "Qwen/Qwen3-4B-Thinking-2507"
      VERIFY: "1"
      BON_TRIES: "3"
      HF_HOME: /workspace/hf_cache
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 24G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]
              capabilities: [gpu]
    restart: "no"
