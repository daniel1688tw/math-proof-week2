# QLoRA 8B 訓練（daniel- 前綴、只用 GPU 1、資源設上限——共用伺服器規範見 COMMANDS.md §9）
services:
  daniel-qlora:
    build: .
    image: daniel-qlora-train
    container_name: daniel-qlora
    working_dir: /workspace
    command: bash run_train.sh
    environment:
      MODEL_NAME: "Qwen/Qwen3-8B"
      TRAIN_JSONL: /workspace/data/train.jsonl
      VAL_JSONL: /workspace/data/val.jsonl
      ADAPTER_DIR: /workspace/out/qlora8b_adapter_v1
      # 24GB 顯存：序列 1024 消除截斷、micro-batch 4 × accum 4 = 有效 16（與本機一致）
      MAX_LEN: "1024"
      BATCH: "4"
      GRAD_ACCUM: "4"
      EPOCHS: "3"
      EVAL_STEPS: "20"
      OPTIM: "adamw_8bit"
      NEFTUNE_ALPHA: "5"
    volumes:
      - ./workspace:/workspace
    deploy:
      resources:
        limits:
          cpus: "8"
          memory: 16G
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["1"]     # GPU 0 有他人服務，固定用 GPU 1
              capabilities: [gpu]
    restart: "no"
